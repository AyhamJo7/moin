# CodeQL data-flow analysis (QG-01 supplement). Semgrep and ESLint match patterns; CodeQL follows
# values across functions and files, which is what finds an injection or an authorization bypass
# whose source and sink are three calls apart. Results go to code scanning (Security tab and PR
# annotations). It is not a required check yet: it starts advisory so its false-positive rate is
# known before it can block a merge. Promoting it is a ruleset change, which is the founder's.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: new queries ship with CodeQL releases and find old code.
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload results to code scanning; nothing else is written.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/__fixtures__/**'
              - .semgrep
              - '**/dist/**'

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
