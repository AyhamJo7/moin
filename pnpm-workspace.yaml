packages:
  - apps/*
  - packages/*

# P02.08.03 — no dependency may run an install script unless it is listed here and the reason
# was reviewed. An unreviewed postinstall is arbitrary code execution at `pnpm install` time,
# on every developer machine and every CI runner.
onlyBuiltDependencies:
  # esbuild: fetches its platform binary. Reviewed; it is a build-time dependency of vite/vitest.
  - esbuild
  # sharp / libvips: Next.js image optimisation. The script selects the prebuilt platform binary.
  - sharp
  - '@img/sharp-libvips-linux-x64'
  - '@img/sharp-libvips-linuxmusl-x64'
  - '@img/sharp-libvips-linux-arm64'
  - '@img/sharp-libvips-linuxmusl-arm64'
