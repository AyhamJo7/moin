# The demo's stand-in for the load balancer (ADR-0001, owner-app comments in next.config.ts):
# one origin for the browser, `/api/*` to the API, everything else to the owner app. The
# `__Host-` session cookie and the CSRF origin check both depend on this single origin.
# The API and the owner app share this container's network namespace (see docker-compose.yml),
# so both upstreams are loopback.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  client_max_body_size 64k;
  proxy_http_version 1.1;
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;

  server {
    listen 3000;

    # Answers by itself: it says the edge runs, not that the upstreams do (they have their own
    # health checks).
    location = /__edge {
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass http://127.0.0.1:3101;
    }

    location / {
      proxy_pass http://127.0.0.1:3001;
    }
  }
}
