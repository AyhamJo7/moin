# ElasticMQ queues for local development (P02.04.01).
#
# The queue topology mirrors what P08 provisions in AWS, including the FIFO queues and the
# dead-letter queues, so a redrive or an ordering bug shows up locally rather than in staging.

include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  moin-outbox {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "moin-outbox-dlq"
      maxReceiveCount = 5
    }
  }
  moin-outbox-dlq { }

  moin-jobs {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "moin-jobs-dlq"
      maxReceiveCount = 5
    }
  }
  moin-jobs-dlq { }

  # FIFO, because per-conversation events must not be reordered: a call that is finalised before
  # its last turn is recorded loses the outcome (INV-06).
  "moin-conversation.fifo" {
    defaultVisibilityTimeout = 30 seconds
    fifo = true
    contentBasedDeduplication = false
    deadLettersQueue {
      name = "moin-conversation-dlq.fifo"
      maxReceiveCount = 5
    }
  }
  "moin-conversation-dlq.fifo" {
    fifo = true
    contentBasedDeduplication = false
  }
}

messages-storage {
  enabled = false
}
